name: Frogbot Scan

on:
  pull_request:
  workflow_dispatch:

jobs:
  frogbot-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run Frogbot
        uses: jfrog/frogbot@v2
        with:
          version: latest
        env:
          JF_URL: https://soleng.jfrog.io            # your JFrog URL (no trailing slash)
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}  # your JFrog access token
